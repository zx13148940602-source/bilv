<html lang="zh-CN">
<head>

<meta name="description" content="毕旅 · 毕业旅行拼团规划：意向卡、目的地投票、主干与支线行程、费用分摊与结算。">
<title>毕旅 · 毕业旅行拼团</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23111827'/%3E%3Ctext x='16' y='22' font-size='16' font-family='sans-serif' font-weight='700' fill='%23FBF7F2' text-anchor='middle'%3E毕%3C/text%3E%3C/svg%3E">
<style>
:root{
  --paper:#FBF7F2;
  --paper-deep:#F5EEE4;
  --surface:#FFFFFF;
  --ink:#111827;
  --ink-2:#374151;
  --muted:#4B5563;
  --faint:#6B7280;
  --line:#E9E2D8;
  --line-soft:#F2ECE3;
  --accent:#C2410C;
  --accent-deep:#9A3412;
  --accent-soft:#FCEAE1;
  --teal:#0F766E;
  --teal-soft:#E7F3F0;
  --success:#15803D;
  --success-soft:#E9F5EC;
  --warn:#B45309;
  --warn-soft:#FDF3E3;
  --r-xl:24px;
  --r-lg:18px;
  --r-md:13px;
  --shadow:0 1px 2px rgba(17,24,39,.04), 0 10px 28px rgba(17,24,39,.05);
  --focus:0 0 0 3px rgba(15,118,110,.32);
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;color-scheme:light}
body{
  margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}\nh1,h2,h3,h4{text-wrap:balance}
button:disabled{cursor:not-allowed}
input,select{font:inherit;font-size:16px;color:var(--ink)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:10px}
::selection{background:var(--accent-soft);color:var(--accent-deep)}
.phone{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--paper);position:relative;padding-bottom:92px}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px;
  background:rgba(251,247,242,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;transition:border-color .2s var(--ease);
}
.topbar.scrolled{border-bottom-color:var(--line)}
.logo{width:36px;height:36px;border-radius:11px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex:none}
.brand{font-weight:800;font-size:16px;color:var(--ink);letter-spacing:.4px;line-height:1.15}
.brand small{display:block;font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.9px;margin-top:2px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.demo{font-size:11.5px;color:var(--accent-deep);background:var(--accent-soft);padding:4px 9px;border-radius:20px;font-weight:700;letter-spacing:.3px}
.me{width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
main{padding:4px 18px 8px}
.hero{
  background:linear-gradient(155deg,#111827 0%,#1B2537 58%,#243149 100%);
  border-radius:var(--r-xl);padding:22px 22px 18px;color:#F8F5EF;position:relative;overflow:hidden;
  box-shadow:0 18px 40px rgba(17,24,39,.18);
}
.hero .kicker{font-size:12px;letter-spacing:1.4px;color:#C7CEDA;font-weight:600}
.hero h1{margin:8px 0 2px;font-size:34px;letter-spacing:.5px;font-weight:800;line-height:1.18}
.hero h1 span{font-size:15px;font-weight:600;color:#C7CEDA;letter-spacing:0;margin-left:8px}
.hero .dates{color:#C7CEDA;font-size:13px;margin:0 0 18px}
.hero .route{position:absolute;right:16px;top:22px;opacity:.6;pointer-events:none}
.hero-stats{display:flex;gap:22px;margin-bottom:16px}
.stat b{display:block;font-size:21px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:#AEB7C6}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:#C7CEDA;margin-bottom:6px}
.progress-head b{color:#F8F5EF;font-size:13px;font-variant-numeric:tabular-nums}
.progress-track{height:6px;border-radius:6px;background:rgba(248,245,239,.16);overflow:hidden}
.progress-track i{display:block;height:100%;border-radius:6px;background:#F97316;transition:width .5s var(--ease)}
.section{margin-top:24px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-head h2{margin:0;font-size:16px;color:var(--ink);font-weight:800;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.sec-head h2:before{content:"";width:4px;height:15px;border-radius:2px;background:var(--accent);display:inline-block}
.sec-head .meta{font-size:12px;color:var(--faint);text-align:right}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.todo{display:flex;align-items:center;gap:13px;width:100%;padding:14px 15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:10px;box-shadow:var(--shadow);transition:transform .18s var(--ease),border-color .18s var(--ease)}
.todo:active{transform:scale(.985)}
.todo:hover{border-color:#D9CFC1}
.todo .ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-deep);flex:none}
.todo .ico.teal{background:var(--teal-soft);color:var(--teal)}
.todo .ico.warn{background:var(--warn-soft);color:var(--warn)}
.todo .txt{flex:1;min-width:0}
.todo .txt b{display:block;font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.35}
.todo .txt span{font-size:12.5px;color:var(--faint);display:block;margin-top:2px}
.todo .go{color:var(--accent);flex:none;display:flex;align-items:center}
.todo.priority{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.todo.priority .ico{background:rgba(249,115,22,.16);color:#FDBA74}
.todo.priority .txt b{color:#F8F5EF}
.todo.priority .txt span{color:#AEB7C6}
.todo.priority .go{color:#FDBA74}
.members{display:flex;flex-wrap:wrap;gap:11px}
.mem{width:46px;text-align:center;position:relative}
.mem .av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;margin:0 auto}
.mem .nm{font-size:11.5px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem.empty .av{background:var(--paper-deep);color:#7C6F60;border:1px dashed #CFC5B8}
.mem .dot{position:absolute;right:3px;top:1px;width:9px;height:9px;border-radius:50%;background:var(--success);border:2px solid var(--paper)}
.bars{display:grid;gap:10px;margin-top:2px}
.bar{display:grid;grid-template-columns:86px 1fr 38px;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.bar .track{height:7px;background:var(--line-soft);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--accent);opacity:.9}
.bar b{color:var(--ink);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.insight{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:var(--r-md);padding:14px 15px;margin-top:12px}
.insight .lbl{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--accent-deep);display:flex;align-items:center;gap:6px}
.insight p{margin:5px 0 0;font-size:13px;color:#4A2E1E;line-height:1.6}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:11px;transition:transform .18s var(--ease)}
.q:active{transform:scale(.98)}
.q .qi{width:38px;height:38px;border-radius:11px;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.q b{font-size:13px;color:var(--ink);display:block;line-height:1.3}
.q span{font-size:11.5px;color:var(--faint);display:block;margin-top:1px}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-xl);padding:17px;box-shadow:var(--shadow);margin-bottom:12px;transition:border-color .18s var(--ease);position:relative}
.opt.picked{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rankbadge{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.opt-top{display:flex;align-items:flex-start;gap:13px}
.opt .score{width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--s)*1%),var(--line-soft) 0);display:flex;align-items:center;justify-content:center;flex:none}
.opt .score i{width:44px;height:44px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.opt h3{margin:0;font-size:20px;color:var(--ink);font-weight:800;line-height:1.25}
.opt h3 small{font-size:11px;color:var(--faint);font-weight:600;margin-left:5px}
.opt .meta{font-size:12.5px;color:var(--faint);margin-top:3px}
.pill{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--paper-deep);color:var(--muted);margin:7px 5px 0 0;white-space:nowrap}
.opt .line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:13px;padding-top:11px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--faint)}
.opt .line b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums}
.opt .why{font-size:12.5px;color:var(--muted);margin-top:9px;line-height:1.55}
.pickbtn{width:100%;min-height:48px;margin-top:13px;background:var(--paper-deep);color:var(--ink);font-weight:700;font-size:13.5px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .18s var(--ease)}
.pickbtn.on{background:var(--accent-soft);color:var(--accent-deep);box-shadow:inset 0 0 0 1px #F1C6B2}
.vote-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:16px;box-shadow:var(--shadow);margin-top:14px}
.rankline{display:flex;align-items:center;gap:11px;min-height:46px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:13px}
.rankline:last-of-type{border:0}
.rankline .no{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;font-variant-numeric:tabular-nums}
.rankline .no.gray{background:var(--line-soft);color:var(--faint)}
.rankline .nm{flex:1;color:var(--ink);font-weight:700}
.rankline .sc{font-weight:800;color:var(--accent-deep);font-size:12px;font-variant-numeric:tabular-nums}
.primary{width:100%;min-height:52px;background:var(--accent);color:#fff;font-weight:800;font-size:15px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 8px 20px rgba(194,65,12,.18);transition:transform .15s var(--ease),background .18s var(--ease)}
.primary:active{transform:scale(.99)}
.primary:disabled{background:#D6CEC3;color:#7A7167;box-shadow:none}
.ghost{width:100%;min-height:50px;background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;border-radius:14px;border:1px solid var(--line);margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px}
.hintline{font-size:12px;color:var(--faint);text-align:center;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:5px}
.consensus{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.tag{font-size:11.5px;padding:4px 10px;border-radius:8px;background:var(--paper-deep);color:var(--muted);font-weight:600;white-space:nowrap}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--success-soft);color:var(--success)}
.score-row{margin:12px 0}
.score-row .sh{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.score-row .sh span{color:var(--muted);font-weight:600}
.score-row .sh b{color:var(--ink);font-variant-numeric:tabular-nums}
.score-row .st{height:7px;border-radius:7px;background:var(--line-soft);overflow:hidden}
.score-row .st i{display:block;height:100%;background:var(--accent);border-radius:7px;transition:width .45s var(--ease)}
.score-row.first .sh span{color:var(--ink);font-weight:800}
.score-row.first .st i{background:var(--ink)}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:2px 0 11px}
.day{min-height:44px;padding:0 4px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.day.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:2px;background:var(--line)}
.tl-item{position:relative;margin-bottom:12px}
.tl-item:before{content:"";position:absolute;left:-21px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--paper)}
.tl-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;box-shadow:var(--shadow)}
.tl-card .t{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--faint);font-weight:700;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.tl-card h4{margin:5px 0 2px;font-size:14px;color:var(--ink);font-weight:700;line-height:1.4}
.tl-card .d{font-size:12px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.branch{font-size:11px;padding:2px 7px;border-radius:6px;background:#E8EEF8;color:#34507E;font-weight:700}
.branch.b{background:var(--accent-soft);color:var(--accent-deep)}
.ledger-top{background:linear-gradient(155deg,#111827,#243149);border-radius:var(--r-xl);padding:19px;color:#F8F5EF;box-shadow:0 16px 34px rgba(17,24,39,.18)}
.ledger-top .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.ledger-top .big{font-size:33px;font-weight:800;letter-spacing:.4px;font-variant-numeric:tabular-nums;line-height:1.15}
.ledger-top small{color:#AEB7C6;font-size:11.5px}
.ledger-top .mini{display:flex;gap:16px;margin-top:15px;padding-top:13px;border-top:1px solid rgba(248,245,239,.14);font-size:11.5px;color:#C7CEDA}
.ledger-top .mini b{display:block;color:#F8F5EF;font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.exp{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.exp .ei{width:40px;height:40px;border-radius:11px;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.exp .et{flex:1;min-width:0}
.exp .et b{display:block;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.exp .et span{font-size:11.5px;color:var(--faint);display:block;margin-top:1px}
.exp .amt{text-align:right;font-weight:800;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.exp .amt span{display:block;font-weight:500;font-size:11px;color:var(--faint);margin-top:1px}
.settle{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow)}
.settle .tr{display:flex;align-items:center;gap:8px;font-size:13px;min-height:42px;border-bottom:1px solid var(--line-soft)}
.settle .tr:last-of-type{border:0}
.settle .who{font-weight:700;color:var(--ink)}
.settle .arrow{color:var(--accent);flex:none}
.settle .money{margin-left:auto;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.more{margin-top:2px}
.more summary{min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--accent-deep);font-size:12px;font-weight:700;cursor:pointer;list-style:none;gap:4px}
.more summary::-webkit-details-marker{display:none}
.footnote{text-align:center;font-size:11.5px;color:var(--faint);margin:22px 0 4px;line-height:1.8}
.linkbtn{color:var(--accent-deep);font-weight:700;font-size:11.5px;text-decoration:underline;text-underline-offset:2px}
.tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:50;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;color:var(--faint);font-size:11.5px;font-weight:700;border-radius:12px;position:relative}
.tab .ti{height:24px;display:flex;align-items:center;justify-content:center}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab.on:before{content:"";position:absolute;top:0;width:22px;height:3px;border-radius:3px;background:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.46);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal.open{display:flex}
.sheet{width:100%;max-width:480px;background:var(--paper);border-radius:26px 26px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto;animation:sheetUp .24s var(--ease)}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:#D8CFC2;margin:0 auto 12px}
.sheet-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.sheet h3{margin:0;font-size:20px;color:var(--ink);font-weight:800;flex:1}
.sheet h3:focus,#vote-result h2:focus{outline:none}
.xbtn{width:44px;height:44px;border-radius:50%;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none;margin:-4px -4px 0 0}
.sheet .hint{font-size:12.5px;color:var(--faint);margin:0 0 18px;line-height:1.5}
.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:7px}
.field .val{color:var(--accent-deep);font-variant-numeric:tabular-nums}
.field input[type=text],.field input[type=number],.field select{width:100%;min-height:48px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface);outline:none;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--teal);box-shadow:var(--focus)}
.field input[aria-invalid="true"]{border-color:#B91C1C;box-shadow:0 0 0 3px #FEE2E2}
.field input[type=range]{width:100%;accent-color:var(--accent);height:32px}
.err{display:none;font-size:12px;color:#B91C1C;margin-top:6px;font-weight:600}
.err.show{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12.5px;min-height:44px;padding:0 13px;border-radius:22px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-weight:600;display:inline-flex;align-items:center}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--paper);font-size:12.5px;padding:11px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:200;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.emptybox{text-align:center;padding:28px 16px;color:var(--faint);font-size:13px}
.emptybox svg{color:#B9AE9F;margin-bottom:6px}
.skip{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:0 0 10px 0;z-index:300}
.skip:focus{left:0}
@media (min-width:520px){
  body{padding:24px 0}
  .phone{border-radius:30px;overflow:hidden;min-height:calc(100dvh - 48px);box-shadow:0 30px 80px rgba(17,24,39,.14)}
  .topbar{position:sticky}
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<a class="skip" href="#app">跳到主要内容</a>
<div class="phone">
  <header class="topbar" id="topbar">
    <div class="logo" aria-hidden="true">毕</div>
    <div class="brand">毕旅<small>GRAD TRIP · 拼团规划</small></div>
    <div class="top-right"><span class="demo">演示</span><div class="me" aria-hidden="true">林</div></div>
  </header>
  <main id="app" role="tabpanel" aria-label="毕业旅行拼团"></main>
  <nav class="tabbar" role="tablist" aria-label="主导航">
    <button class="tab on" role="tab" aria-selected="true" data-act="tab" data-tab="home" aria-controls="app">
      <span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>团</button>
    <button class="tab" role="tab" aria-selected="false" data-act="tab" data-tab="decide" aria-controls="app">
      <span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="m8 12 3 3 5-6"/></svg></span>定案</button>
    <button class="tab" role="tab" aria-selected="false" data-act="tab" data-tab="trip" aria-controls="app">
      <span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>行程</button>
    <button class="tab" role="tab" aria-selected="false" data-act="tab" data-tab="ledger" aria-controls="app">
      <span class="ti"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v12H3z"/><path d="M3 7V5h14v2"/><circle cx="16" cy="13" r="1.2"/></svg></span>账本</button>
  </nav>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const LS="bilv_demo_v3";
const COLORS=["#9A3412","#34507E","#0F766E","#6B4C7A","#A23B2A","#3F6B7A","#8A5A1F","#4B5B7C","#6E5730","#3F6448","#7C3F52","#4A5568"];
const NAMES=["林知夏","陈一鸣","王雨桐","赵一凡","孙可","李慕","周野","吴桐","郑好","何一","徐来","方晴"];

const ICONS={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  vote:'<path d="M4 4h16v16H4z"/><path d="m8 12 3 3 5-6"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',
  wallet:'<path d="M3 7h18v12H3z"/><path d="M3 7V5h14v2"/><circle cx="16" cy="13" r="1.2"/>',
  clipboard:'<rect x="8" y="4" width="8" height="4" rx="1"/><path d="M16 6h2v14H6V6h2"/><path d="M9 12h6M9 16h4"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  link:'<path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>',
  sparkles:'<path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  arrow:'<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>',
  chevron:'<path d="m9 6 6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  alert:'<path d="M12 3 2 21h20z"/><path d="M12 9v5M12 17.5v.5"/>',
  check:'<path d="m5 12 4 4L19 6"/>',
  train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M9 21l2-4M15 21l-2-4"/>',
  bed:'<path d="M3 18V8h18v10"/><path d="M3 14h18"/><path d="M7 8V6h4v2"/>',
  food:'<path d="M6 3v8M9 3v8M7.5 11v10"/><path d="M17 3c-1.5 2-2 4-2 6 0 2 1 3 2 3s2-1 2-3c0-2-.5-4-2-6z"/><path d="M17 12v9"/>',
  mountain:'<path d="m3 20 6-11 4 7 3-5 5 9z"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/>',
  pin:'<path d="M12 21s7-6 7-11a7 7 0 1 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  wallet2:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12h3"/>'
};
function ic(name,size=20,cls){
  return '<svg viewBox="0 0 24 24" width="'+size+'" height="'+size+'" '+(cls?'class="'+cls+'" ':'')+'aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>';
}

const seed=()=>({
  me:"m1",
  members:NAMES.map((n,i)=>({id:"m"+(i+1),name:n,role:i===0?"团长":i===1?"财务官":"成员",budget:[2500,1800,3200,2200,1500,2800,2400,3500,1200,2600,4200,3000][i],filled:i<9,tags:[]})),
  options:[
    {id:"qd",name:"青岛",days:"4 天 3 晚",price:2380,low:2100,high:2600,score:86,cover:11,total:12,tags:["海边","老城","高铁直达"],pros:"海边 + 啤酒 + 老城，预算可控",cons:"7 月旺季人多",transport:"高铁 4.5h"},
    {id:"cd",name:"成都",days:"5 天 4 晚",price:2650,low:2400,high:2900,score:81,cover:9,total:12,tags:["美食","熊猫","城市"],pros:"吃得好、玩得松，适合大团",cons:"人均偏高，3 人预算吃紧",transport:"飞机 3h"},
    {id:"dl",name:"大理",days:"5 天 4 晚",price:3100,low:2800,high:3400,score:74,cover:7,total:12,tags:["洱海","躺平","出片"],pros:"最适合躺平与拍照",cons:"交通耗时，预算超出 5 人上限",transport:"飞机 + 动车"}
  ],
  votes:[
    {m:"m2",r:["qd","cd","dl"]},{m:"m3",r:["qd","cd","dl"]},{m:"m4",r:["qd","cd","dl"]},
    {m:"m5",r:["cd","qd","dl"]},{m:"m6",r:["cd","qd","dl"]},
    {m:"m7",r:["dl","cd","qd"]},{m:"m8",r:["qd","dl","cd"]}
  ],
  veto:["m2","m5","m9"],
  expenses:[
    {id:"e1",title:"高铁往返",amount:7200,payer:"m1",rule:"全员均摊",parts:["m1","m2","m3","m4","m5","m6","m7","m8","m9","m10","m11","m12"]},
    {id:"e2",title:"民宿定金",amount:2400,payer:"m4",rule:"按参与人",parts:["m1","m2","m3","m4","m5","m6","m7","m8","m9","m10"]},
    {id:"e3",title:"包车定金",amount:1200,payer:"m3",rule:"按参与人",parts:["m1","m2","m3","m4","m5","m6","m7","m8"]},
    {id:"e4",title:"海鲜聚餐",amount:1800,payer:"m2",rule:"全员均摊",parts:["m1","m2","m3","m4","m5","m6","m7","m8","m9","m10","m11","m12"]}
  ],
  itinerary:{
    1:[{t:"08:30",title:"高铁 G106 · 北京南 → 青岛",d:"4h30 · 全员",cost:600,branch:""},{t:"14:00",title:"民宿入住 · 大学路",d:"10 人 · 3 晚",cost:480,branch:""},{t:"18:30",title:"台东夜市",d:"自由觅食 · 人均 60",cost:60,branch:""}],
    2:[{t:"09:00",title:"八大关漫步",d:"全程约 3h",cost:0,branch:""},{t:"14:00",title:"海水浴场躺平",d:"A 线 · 7 人",cost:0,branch:"A"},{t:"14:00",title:"崂山轻徒步",d:"B 线 · 4 人",cost:120,branch:"B"},{t:"19:00",title:"海鲜大餐",d:"12 人 · 已订位",cost:150,branch:""}],
    3:[{t:"10:00",title:"青岛啤酒博物馆",d:"门票 60 · 9 人",cost:60,branch:""},{t:"15:00",title:"小麦岛看日落",d:"拍照局",cost:0,branch:""},{t:"20:00",title:"民宿桌游夜",d:"自愿参加",cost:0,branch:""}],
    4:[{t:"09:00",title:"栈桥 + 老城区",d:"退房后集合",cost:0,branch:""},{t:"13:00",title:"返程 · 高铁 G115",d:"4h30",cost:600,branch:""}]
  }
});
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.members&&s.options)return s}catch(e){}return seed()}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
const ui={tab:(location.hash||"#home").slice(1),day:1,rank:[],tmp:{}};
if(!["home","decide","trip","ledger"].includes(ui.tab))ui.tab="home";
const $=s=>document.querySelector(s);
function setHash(t,push){try{push?history.pushState(null,"","#"+t):history.replaceState(null,"","#"+t)}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"¥"+Math.round(n).toLocaleString("zh-CN");
const byId=id=>state.members.find(m=>m.id===id)||{name:"?"};
const ini=n=>n.slice(0,1);

function borda(){
  const map={};state.options.forEach(o=>map[o.id]=0);
  state.votes.forEach(v=>v.r.forEach((id,i)=>map[id]+=3-i));
  const arr=state.options.map(o=>({...o,pts:map[o.id]})).sort((a,b)=>b.pts-a.pts);
  const total=state.votes.length*6||1;
  return {arr,total,cons:Math.round((arr[0].pts-arr[1].pts)/total*100)};
}
function totals(){
  const paid={},owed={};state.members.forEach(m=>{paid[m.id]=0;owed[m.id]=0});
  state.expenses.forEach(e=>{paid[e.payer]+=e.amount;e.parts.forEach(id=>owed[id]+=e.amount/e.parts.length)});
  return {paid,owed,total:state.expenses.reduce((s,e)=>s+e.amount,0)};
}
function settle(){
  const {paid,owed}=totals();
  const cs=state.members.map(m=>({id:m.id,b:paid[m.id]-owed[m.id]})).filter(x=>x.b>0.5).sort((a,b)=>b.b-a.b);
  const ds=state.members.map(m=>({id:m.id,b:paid[m.id]-owed[m.id]})).filter(x=>x.b<-0.5).sort((a,b)=>a.b-b.b);
  const out=[];let i=0,j=0;
  while(i<ds.length&&j<cs.length){const a=Math.min(-ds[i].b,cs[j].b);out.push({from:ds[i].id,to:cs[j].id,amt:a});ds[i].b+=a;cs[j].b-=a;if(ds[i].b>-0.5)i++;if(cs[j].b<0.5)j++}
  return out;
}
function memberList(){
  return state.members.map((m,i)=>`<div class="mem ${m.filled?"":"empty"}">
    <div class="av" style="background:${m.filled?COLORS[i%COLORS.length]:"#F5EEE4"}">${m.filled?ini(m.name):ic("plus",16)}</div>
    ${m.filled?'<span class="dot" aria-hidden="true"></span>':""}
    <div class="nm">${m.id===state.me?"我":esc(m.name)}</div></div>`).join("");
}
function budgetBars(){
  const buckets=[["< ¥1,500",0],["¥1,500–2,500",0],["¥2,500–4,000",0],["> ¥4,000",0]];
  state.members.forEach(m=>{const b=m.budget;if(b<1500)buckets[0][1]++;else if(b<2500)buckets[1][1]++;else if(b<4000)buckets[2][1]++;else buckets[3][1]++});
  const max=Math.max(...buckets.map(b=>b[1]),1);
  return buckets.map(b=>`<div class="bar"><span>${b[0]}</span><div class="track"><div class="fill" style="width:${b[1]/max*100}%"></div></div><b>${b[1]} 人</b></div>`).join("");
}

function home(){
  const filled=state.members.filter(m=>m.filled).length;
  const t=totals();
  const leader=borda().arr[0].name;
  return `
  <div class="hero">
    <svg class="route" width="118" height="54" viewBox="0 0 118 54" aria-hidden="true">
      <path d="M6 46C34 46 42 10 82 10" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4 5" fill="none"/>
      <circle cx="6" cy="46" r="3.2" fill="#F97316"/><circle cx="82" cy="10" r="3.2" fill="#F97316"/>
      <path d="M96 10h14M103 4l7 6-7 6" stroke="#F97316" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="kicker">2027 届 · 计科二班</div>
    <h1>青岛<span>4 天 3 晚</span></h1>
    <p class="dates">6 月 15 日 — 6 月 18 日 · 12 人成团</p>
    <div class="hero-stats">
      <div class="stat"><b>12</b><span>已加入</span></div>
      <div class="stat"><b>${filled}/12</b><span>已填意向</span></div>
      <div class="stat"><b>${state.votes.length}</b><span>已投票</span></div>
    </div>
    <div class="progress-head"><span>定案进度</span><b>78%</b></div>
    <div class="progress-track" role="progressbar" aria-label="定案进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="78"><i style="width:78%"></i></div>
  </div>

  <div class="section">
    <div class="sec-head"><h2>现在要做</h2><span class="meta">3 件</span></div>
    <button class="todo priority" data-act="tab" data-tab="decide">
      <span class="ico">${ic("vote",21)}</span>
      <span class="txt"><b>目的地投票今晚截止</b><span>22:00 截止 · ${state.votes.length}/12 人已投</span></span>
      <span class="go">${ic("chevron",18)}</span>
    </button>
    <button class="todo" data-act="open:pref">
      <span class="ico teal">${ic("clipboard",20)}</span>
      <span class="txt"><b>还有 3 人没填意向卡</b><span>催一催，聚合结果才准</span></span>
      <span class="go">${ic("chevron",18)}</span>
    </button>
    <button class="todo" data-act="tab" data-tab="ledger">
      <span class="ico warn">${ic("wallet",20)}</span>
      <span class="txt"><b>民宿尾款 6/10 前支付</b><span>还差 ¥2,400 · 当前人均 ${money(t.total/12)}</span></span>
      <span class="go">${ic("chevron",18)}</span>
    </button>
  </div>

  <div class="section">
    <div class="sec-head"><h2>成员</h2><span class="meta">${filled} 人已填</span></div>
    <div class="members">${memberList()}</div>
  </div>

  <div class="section">
    <div class="card">
      <div class="sec-head" style="margin-bottom:12px"><h2 style="font-size:15px">预算分布</h2><span class="meta">中位数 ¥2,550</span></div>
      <div class="bars">${budgetBars()}</div>
    </div>
    <div class="insight">
      <div class="lbl">${ic("sparkles",14)} 系统建议</div>
      <p>青岛走「经济支线」（青旅 + 公交 + 自带早餐），3 位预算敏感成员人均可从 ¥2,380 降到 ¥1,780，覆盖率由 11/12 提升到 12/12。</p>
    </div>
  </div>

  <div class="section">
    <div class="sec-head"><h2>快捷入口</h2><span class="meta">30 秒上手</span></div>
    <div class="quick">
      <button class="q" data-act="open:pref"><span class="qi">${ic("clipboard",19)}</span><span><b>填意向卡</b><span>3 分钟说清底线</span></span></button>
      <button class="q" data-act="tab" data-tab="decide"><span class="qi">${ic("vote",19)}</span><span><b>投一票</b><span>选出目的地</span></span></button>
      <button class="q" data-act="open:expense"><span class="qi">${ic("receipt",19)}</span><span><b>记一笔</b><span>3 秒记公共开销</span></span></button>
      <button class="q" data-act="invite"><span class="qi">${ic("link",19)}</span><span><b>邀请同学</b><span>复制团链接</span></span></button>
    </div>
  </div>
  <div class="footnote">演示数据保存在本机浏览器 · <button class="linkbtn" data-act="reset">重置演示</button></div>`;
}

function optionCard(o){
  const picked=ui.rank.indexOf(o.id);
  return `<div class="opt ${picked>=0?"picked":""}">
    ${picked>=0?`<span class="rankbadge" aria-label="我的第 ${picked+1} 顺位">${picked+1}</span>`:""}
    <div class="opt-top">
      <div class="score" style="--s:${o.score}" role="img" aria-label="匹配度 ${o.score} 分"><i>${o.score}</i></div>
      <div style="flex:1;min-width:0">
        <h3>${esc(o.name)}<small>匹配度</small></h3>
        <div class="meta">${o.days} · ${o.transport} · 覆盖 ${o.cover}/${o.total} 人</div>
        <div>${o.tags.map(t=>`<span class="pill">${t}</span>`).join("")}</div>
      </div>
    </div>
    <div class="line"><span>人均 <b>${money(o.low)}–${money(o.high)}</b></span><span>${o.cover>=11?'<span class="tag ok">覆盖良好</span>':o.cover>=9?'<span class="tag warn">3 人超预算</span>':'<span class="tag warn">5 人超预算</span>'}</span></div>
    <div class="why">✓ ${o.pros}<br>△ ${o.cons}</div>
    <button class="pickbtn ${picked>=0?"on":""}" data-act="rank" data-id="${o.id}" aria-pressed="${picked>=0}">${picked>=0?`已选为第 ${picked+1} 顺位`:"加入我的排序"}</button>
  </div>`;
}

function decide(){
  const b=borda();
  const my=state.votes.find(v=>v.m===state.me);
  const maxPts=Math.max(...b.arr.map(o=>o.pts),1);
  return `
  <div class="section" style="margin-top:6px">
    <div class="sec-head"><h2>三个候选</h2><span class="meta">按时间 · 预算 · 偏好排序</span></div>
    ${state.options.map(o=>optionCard(o)).join("")}
  </div>
  <div class="vote-box">
    <div class="sec-head" style="margin-bottom:6px"><h2 style="font-size:15px">我的排序</h2><span class="meta">点方案加入，可取消</span></div>
    ${[0,1,2].map(i=>{const id=ui.rank[i];const o=state.options.find(x=>x.id===id);return `<div class="rankline"><span class="no ${o?"":"gray"}">${i+1}</span><span class="nm">${o?esc(o.name):"待选择"}</span><span class="sc">${o?(3-i)+" 分":""}</span></div>`}).join("")}
    <button class="primary" style="margin-top:12px" data-act="vote:submit" ${ui.rank.length<3?"disabled aria-disabled=\"true\"":""}>${my?"更新我的排序":"提交排序投票"}</button>
    ${ui.rank.length<3?'<div class="hintline">'+ic("alert",13)+" 请先排满 3 个顺位</div>":'<div class="hintline">'+ic("check",13)+" 提交后可在截止前修改</div>"}
  </div>
  <div class="section" id="vote-result">
    <div class="sec-head"><h2>当前票型</h2><span class="meta">${state.votes.length}/12 人已投</span></div>
    <div class="card">
      ${b.arr.map((o,i)=>`<div class="score-row ${i===0?"first":""}"><div class="sh"><span>${i===0?"领先 · ":""}${esc(o.name)}</span><b>${o.pts} 分</b></div><div class="st"><i style="width:${o.pts/maxPts*100}%"></i></div></div>`).join("")}
      <div class="consensus">
        <span class="tag ${b.cons<10?"warn":"ok"}">共识度 ${b.cons}%</span>
        <span class="tag">${b.cons<10?"弱共识，建议补偿讨论":"共识稳固"}</span>
        <span class="tag">${state.votes.length} 人参与</span>
      </div>
      <div class="insight" style="margin-top:14px">
        <div class="lbl">${ic("sparkles",14)} 系统建议</div>
        <p>${esc(b.arr[0].name)}领先但优势很薄，且 3 人因「预算超 2,500」对其行使否决。建议开启经济支线（人均降 600），或改投${esc(b.arr[1].name)}（人均低 400，飞行多 2 小时）。</p>
      </div>
    </div>
  </div>`;
}

function trip(){
  const items=state.itinerary[ui.day]||[];
  return `
  <div class="section" style="margin-top:6px">
    <div class="sec-head"><h2>青岛 · 行程</h2><span class="meta">主干 + 支线</span></div>
    <div class="days" role="tablist" aria-label="行程日期">
      ${[1,2,3,4].map(d=>`<button class="day ${ui.day===d?"on":""}" role="tab" aria-selected="${ui.day===d}" data-act="day" data-d="${d}">D${d} · ${["6/15","6/16","6/17","6/18"][d-1]}</button>`).join("")}
    </div>
    <div class="tl">
      ${items.map(it=>`<div class="tl-item"><div class="tl-card">
        <div class="t"><span>${it.t}</span><span>${it.branch?`<span class="branch ${it.branch==="B"?"b":""}">${it.branch} 线</span>`:""}</span></div>
        <h4>${esc(it.title)}</h4>
        <div class="d"><span>${esc(it.d)}</span>${it.cost?`<span>· 约 ${money(it.cost)}/人</span>`:""}</div>
      </div></div>`).join("")||'<div class="emptybox">'+ic("calendar",26)+'<div>今天还没有安排</div></div>'}
    </div>
    <button class="ghost" data-act="open:activity">${ic("plus",18)} 添加活动</button>
    <div class="insight">
      <div class="lbl">${ic("pin",14)} 支线提示</div>
      <p>D2 下午分成 A/B 两条线：A 线海水浴场躺平（7 人），B 线崂山轻徒步（4 人）。1 人选择自由活动，晚餐前在民宿集合。</p>
    </div>
  </div>`;
}

function ledger(){
  const t=totals();const mine={paid:t.paid[state.me],owed:t.owed[state.me]};
  const tr=settle();const net=mine.paid-mine.owed;
  const trRow=x=>`<div class="tr"><span class="who">${byId(x.from).name}</span><span class="arrow">${ic("arrow",15)}</span><span class="who">${byId(x.to).name}</span><span class="money">${money(x.amt)}</span></div>`;
  return `
  <div class="section" style="margin-top:6px">
    <div class="ledger-top">
      <div class="row"><div><small>公共支出合计</small><div class="big">${money(t.total)}</div></div><div style="text-align:right"><small>当前人均</small><div style="font-size:20px;font-weight:800;font-variant-numeric:tabular-nums">${money(t.total/12)}</div></div></div>
      <div class="mini"><div>我已垫付<b>${money(mine.paid)}</b></div><div>我应承担<b>${money(mine.owed)}</b></div><div>我的净额<b style="color:${net>=0?"#86EFAC":"#FCA5A5"}">${net>=0?"+":""}${money(net)}</b></div></div>
    </div>
    <button class="primary" style="margin-top:12px" data-act="open:expense">${ic("plus",18)} 记一笔</button>
  </div>

  <div class="section">
    <div class="sec-head"><h2>账目</h2><span class="meta">${state.expenses.length} 笔 · 全部留痕</span></div>
    ${state.expenses.map(e=>`<div class="exp"><div class="ei">${e.rule==="全员均摊"?ic("users",19):ic("receipt",19)}</div>
      <div class="et"><b>${esc(e.title)}</b><span>${esc(byId(e.payer).name)} 垫付 · ${e.rule} · ${e.parts.length} 人</span></div>
      <div class="amt">${money(e.amount)}<span>人均 ${money(e.amount/e.parts.length)}</span></div></div>`).join("")}
  </div>

  <div class="section">
    <div class="sec-head"><h2>一键结算</h2><span class="meta">${tr.length} 笔转账</span></div>
    <div class="settle">
      ${tr.slice(0,4).map(trRow).join("")}
      ${tr.length>4?`<details class="more"><summary>查看其余 ${tr.length-4} 笔转账</summary>${tr.slice(4).map(trRow).join("")}</details>`:""}
      <div style="font-size:11.5px;color:var(--faint);margin-top:10px">净额结算 · 金额以分为单位计算 · 尾差由最后一位分摊人承担</div>
    </div>
  </div>`;
}

const views={home,decide,trip,ledger};
function render(){
  $("#app").innerHTML=views[ui.tab]();
  document.querySelectorAll(".tab").forEach(t=>{
    const on=t.dataset.tab===ui.tab;
    t.classList.toggle("on",on);
    t.setAttribute("aria-selected",on?"true":"false");
    t.tabIndex=on?0:-1;
  });
  document.title=({home:"团",decide:"定案",trip:"行程",ledger:"账本"}[ui.tab]||"团")+" · 毕旅";
  save();
}

/* ---------- modal ---------- */
let lastFocus=null;
function focusables(){return [...$("#sheet").querySelectorAll('button,input,select,textarea,[href]')].filter(el=>!el.disabled&&el.offsetParent!==null)}
function openModal(html){
  lastFocus=document.activeElement;
  $("#sheet").innerHTML=html;
  $("#modal").classList.add("open");
  document.body.style.overflow="hidden";
  const h=$("#sheet").querySelector("h3"),f=focusables()[0];
  setTimeout(()=>{(h||f)&&(h||f).focus()},60);
}
function closeModal(){
  $("#modal").classList.remove("open");
  document.body.style.overflow="";
  if(lastFocus&&lastFocus.focus)lastFocus.focus();
}
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),2000);
}
function sheetHead(title,sub){
  return `<div class="grab" aria-hidden="true"></div><div class="sheet-head"><h3 id="sheet-title" tabindex="-1">${title}</h3><button class="xbtn" data-act="close" aria-label="关闭">${ic("x",20)}</button></div><p class="hint">${sub}</p>`;
}

function prefModal(){
  const m=state.members.find(x=>x.id===state.me);
  ui.tmp.tags=m.tags&&m.tags.length?[...m.tags]:["海边","躺平"];
  openModal(`${sheetHead("我的意向卡","3 分钟说清底线；预算默认只进聚合，别人看不到你的数字。")}
  <div class="field"><label for="budget">可接受的人均预算 <span class="val" id="bv">¥${m.budget.toLocaleString("zh-CN")}</span></label>
    <input id="budget" type="range" min="1000" max="6000" step="100" value="${m.budget}" aria-describedby="bv">
  </div>
  <div class="field"><label id="tag-label">想去的地方（可多选）</label><div class="chips" role="group" aria-labelledby="tag-label">
    ${["海边","山地","古城","城市","出境","自驾","躺平","特种兵"].map(t=>`<button class="chip ${ui.tmp.tags.includes(t)?"on":""}" data-act="pref:tag" data-t="${t}" aria-pressed="${ui.tmp.tags.includes(t)}">${t}</button>`).join("")}
  </div></div>
  <div class="field"><label for="days">可出行天数</label><select id="days"><option>3 天</option><option selected>4 天</option><option>5 天</option><option>6 天以上</option></select></div>
  <button class="primary" data-act="pref:save">保存意向卡</button>`);
}
function expenseModal(){
  openModal(`${sheetHead("记一笔","谁垫付、谁参与、怎么摊，一次记清。")}
  <div class="field"><label for="etitle">项目</label><input id="etitle" type="text" placeholder="例如：民宿尾款" autocomplete="off"></div>
  <div class="field"><label for="eamount">金额（元）</label><input id="eamount" type="number" inputmode="decimal" placeholder="0" aria-describedby="amt-err"><p class="err" id="amt-err" role="alert">请输入大于 0 的金额</p></div>
  <div class="field"><label for="epayer">付款人</label><select id="epayer">${state.members.map(m=>`<option value="${m.id}" ${m.id===state.me?"selected":""}>${esc(m.name)}${m.id===state.me?"（我）":""}</option>`).join("")}</select></div>
  <div class="field"><label for="erule">分摊方式</label><select id="erule"><option>全员均摊</option><option>按参与人</option></select></div>
  <button class="primary" data-act="exp:save">保存这笔</button>`);
}
function activityModal(){
  openModal(`${sheetHead("添加活动","加到 D"+ui.day+" 的行程里。")}
  <div class="field"><label for="atime">时间</label><input id="atime" type="text" value="16:30" placeholder="例如：16:30"></div>
  <div class="field"><label for="atitle">活动名称</label><input id="atitle" type="text" placeholder="例如：五四广场夜景" aria-describedby="title-err"><p class="err" id="title-err" role="alert">请填写活动名称</p></div>
  <div class="field"><label for="adesc">说明</label><input id="adesc" type="text" placeholder="例如：全员 · 免费"></div>
  <div class="field"><label for="acost">人均费用（元）</label><input id="acost" type="number" value="0"></div>
  <button class="primary" data-act="act:save">加入行程</button>`);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act;
  if(act==="tab"){ui.tab=el.dataset.tab;ui.rank=[];closeModal();render();setHash(ui.tab,true);window.scrollTo(0,0);return}
  if(act==="open:pref"){prefModal();return}
  if(act==="open:expense"){expenseModal();return}
  if(act==="open:activity"){activityModal();return}
  if(act==="close"){closeModal();return}
  if(act==="pref:tag"){
    const t=el.dataset.t;const i=ui.tmp.tags.indexOf(t);
    if(i>=0)ui.tmp.tags.splice(i,1);else ui.tmp.tags.push(t);
    el.classList.toggle("on");el.setAttribute("aria-pressed",el.classList.contains("on"));return;
  }
  if(act==="pref:save"){
    const m=state.members.find(x=>x.id===state.me);
    m.budget=+$("#budget").value;m.tags=ui.tmp.tags.slice();m.filled=true;
    save();closeModal();render();toast("意向卡已保存，聚合结果已更新");return;
  }
  if(act==="rank"){
    const id=el.dataset.id;const i=ui.rank.indexOf(id);
    if(i>=0)ui.rank.splice(i,1);else{if(ui.rank.length>=3)ui.rank.shift();ui.rank.push(id)}
    render();
    const btn=document.querySelector('[data-act="rank"][data-id="'+id+'"]');
    if(btn)btn.focus();
    return;
  }
  if(act==="vote:submit"){
    if(ui.rank.length<3)return;
    state.votes=state.votes.filter(v=>v.m!==state.me);
    state.votes.push({m:state.me,r:ui.rank.slice()});
    save();render();toast("排序已提交，截止前可修改");
    const h=document.querySelector("#vote-result h2");
    if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true})}
    return;
  }
  if(act==="exp:save"){
    const title=$("#etitle").value.trim()||"未命名支出";
    const amount=+$("#eamount").value;
    if(!(amount>0)){$("#amt-err").classList.add("show");$("#eamount").setAttribute("aria-invalid","true");$("#eamount").focus();return}
    const payer=$("#epayer").value;const rule=$("#erule").value;
    const parts=state.members.map(m=>m.id);
    state.expenses.push({id:"e"+Date.now(),title,amount,payer,rule,parts});
    save();closeModal();ui.tab="ledger";render();setHash("ledger");toast("已记账，人均已更新");return;
  }
  if(act==="act:save"){
    const title=$("#atitle").value.trim();
    if(!title){$("#title-err").classList.add("show");$("#atitle").setAttribute("aria-invalid","true");$("#atitle").focus();return}
    const time=$("#atime").value.trim()||"18:00";
    state.itinerary[ui.day].push({t:time,title,d:$("#adesc").value.trim()||"待定",cost:+$("#acost").value||0,branch:""});
    save();closeModal();render();toast("已加入 D"+ui.day+" 行程");return;
  }
  if(act==="invite"){
    const url=location.href.split("#")[0];
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>toast("团链接已复制，发给同学吧"),()=>toast("复制失败，请手动复制地址栏"))}
    else toast("复制失败，请手动复制地址栏");
    return;
  }
  if(act==="reset"){
    if(confirm("重置后演示数据恢复初始状态，确定吗？")){state=seed();save();ui.tab="home";ui.rank=[];render();setHash("home");toast("演示数据已重置")}
    return;
  }
});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{
  if(!$("#modal").classList.contains("open"))return;
  if(e.key==="Escape"){closeModal();return}
  if(e.key==="Tab"){
    const f=focusables();if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});

document.addEventListener("input",e=>{
  if(e.target.id==="budget"){const v=$("#bv");if(v)v.textContent="¥"+(+e.target.value).toLocaleString("zh-CN")}
  if(e.target.id==="eamount"&&+e.target.value>0){$("#amt-err").classList.remove("show");e.target.removeAttribute("aria-invalid")}
  if(e.target.id==="atitle"&&e.target.value.trim()){$("#title-err").classList.remove("show");e.target.removeAttribute("aria-invalid")}
});
window.addEventListener("scroll",()=>{$("#topbar").classList.toggle("scrolled",window.scrollY>4)},{passive:true});
window.addEventListener("hashchange",()=>{
  const t=location.hash.slice(1);
  if(["home","decide","trip","ledger"].includes(t)&&t!==ui.tab){ui.tab=t;ui.rank=[];render();window.scrollTo(0,0)}
});
render();
</script>
</body>
</html>
