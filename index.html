<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>毕旅 · 毕业旅行拼团</title>
<style>
:root{
  --navy:#1b2a4a;--navy2:#24365c;--ink:#333d4f;--muted:#6e7787;
  --accent:#b97227;--accent2:#d99a4e;--cream:#fbf6ec;--bg:#f3f4f7;
  --card:#fff;--line:#e7eaf0;--ok:#2f7d5d;
  --shadow:0 10px 30px rgba(27,42,74,.08);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:#e9ecf1;color:var(--ink);font-size:14px;line-height:1.55;
}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:14px;color:var(--ink)}
.phone{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:86px;box-shadow:0 0 70px rgba(27,42,74,.12)}
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:14px 18px 10px;background:rgba(243,244,247,.9);backdrop-filter:blur(14px)}
.logo{width:34px;height:34px;border-radius:11px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;letter-spacing:1px}
.brand{font-weight:800;font-size:16px;color:var(--navy);letter-spacing:.5px;line-height:1.1}
.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500;letter-spacing:.6px;margin-top:2px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.demo{font-size:10px;color:var(--accent);background:#fff4e4;border:1px solid #f3dfc4;padding:3px 8px;border-radius:20px;font-weight:600}
.me{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#d99a4e,#b97227);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
main{padding:4px 18px 10px}
.hero{background:linear-gradient(160deg,#1b2a4a 0%,#24365c 60%,#2c4370 100%);border-radius:22px;padding:20px 20px 18px;color:#fff;position:relative;overflow:hidden;box-shadow:0 16px 36px rgba(27,42,74,.22)}
.hero:after{content:"";position:absolute;right:-50px;top:-70px;width:180px;height:180px;border-radius:50%;background:rgba(217,154,78,.12)}
.hero .kicker{font-size:10px;letter-spacing:2px;color:#c9d3e6;font-weight:600}
.hero h1{margin:6px 0 2px;font-size:26px;letter-spacing:1px;font-weight:800}
.hero .sub{color:#c9d3e6;font-size:12px}
.hero .stats{display:flex;gap:18px;margin-top:16px;position:relative;z-index:1}
.hero .stat b{display:block;font-size:19px;font-weight:800;line-height:1.2}
.hero .stat span{font-size:10px;color:#aeb9d0}
.ring{position:absolute;right:18px;top:18px;width:72px;height:72px;border-radius:50%;background:conic-gradient(#d99a4e 78%,rgba(255,255,255,.16) 0);display:flex;align-items:center;justify-content:center}
.ring i{width:58px;height:58px;border-radius:50%;background:#22335a;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal}
.ring b{font-size:16px}.ring span{font-size:8px;color:#aeb9d0}
.section{margin-top:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-head h2{margin:0;font-size:15px;color:var(--navy);font-weight:800;letter-spacing:.3px}
.sec-head span{font-size:11px;color:var(--muted)}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.todo{display:flex;align-items:center;gap:12px;padding:13px 15px;background:#fff;border-radius:15px;margin-bottom:9px;box-shadow:var(--shadow)}
.todo .ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--cream)}
.todo .txt{flex:1}.todo .txt b{display:block;font-size:13px;font-weight:700;color:var(--navy)}
.todo .txt span{font-size:11px;color:var(--muted)}
.todo .go{font-size:11px;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:2px}
.members{display:flex;flex-wrap:wrap;gap:10px}
.mem{width:38px;text-align:center;position:relative}
.mem .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;margin:0 auto}
.mem .nm{font-size:9px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mem.empty .av{background:#eef0f4;color:#a9b1bf;border:1px dashed #cfd6e0}
.mem .dot{position:absolute;right:1px;top:0;width:8px;height:8px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.bars{display:grid;gap:9px;margin-top:4px}
.bar{display:grid;grid-template-columns:78px 1fr 32px;align-items:center;gap:10px;font-size:11px;color:var(--muted)}
.bar .track{height:8px;background:#eef1f6;border-radius:8px;overflow:hidden}
.bar .fill{height:100%;border-radius:8px;background:linear-gradient(90deg,#d99a4e,#b97227)}
.bar b{color:var(--navy);font-size:11px;text-align:right}
.insight{background:var(--cream);border-left:4px solid var(--accent);border-radius:14px;padding:14px 16px;margin-top:12px}
.insight .lbl{font-size:9px;font-weight:800;letter-spacing:1.5px;color:var(--accent)}
.insight p{margin:5px 0 0;font-size:12px;color:#4a3f33;line-height:1.6}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.q{background:#fff;border-radius:15px;padding:14px;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;text-align:left}
.q .qi{width:32px;height:32px;border-radius:10px;background:#f1f4f9;display:flex;align-items:center;justify-content:center;font-size:15px}
.q b{font-size:12px;color:var(--navy);display:block}.q span{font-size:10px;color:var(--muted)}
.opt{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border:2px solid transparent;transition:.18s}
.opt.picked{border-color:var(--accent)}
.opt-top{display:flex;align-items:flex-start;gap:12px}
.opt-top .score{width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--s)*1%),#eef1f6 0);display:flex;align-items:center;justify-content:center;flex:none}
.opt-top .score i{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;color:var(--navy);font-size:14px}
.opt h3{margin:0;font-size:17px;color:var(--navy)}
.opt .meta{font-size:11px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;background:#f1f4f9;color:#5a6474;margin:6px 4px 0 0}
.pill.hot{background:#fff4e4;color:#a9661f}
.opt .line{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:11px;color:var(--muted)}
.opt .line b{color:var(--navy);font-size:13px}
.opt .why{font-size:11px;color:var(--muted);margin-top:8px}
.pickbtn{width:100%;margin-top:12px;background:#f3f5f9;color:var(--navy);font-weight:700;font-size:12px;padding:10px;border-radius:12px}
.pickbtn.on{background:var(--navy);color:#fff}
.vote-box{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
.rankline{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}
.rankline:last-child{border:0}
.rankline .no{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.rankline .no.gray{background:#e6e9ef;color:#8b94a4}
.rankline .nm{flex:1;color:var(--navy);font-weight:600}
.rankline .sc{font-weight:800;color:var(--accent)}
.primary{width:100%;background:var(--navy);color:#fff;font-weight:700;font-size:14px;padding:14px;border-radius:14px;box-shadow:0 8px 20px rgba(27,42,74,.2)}
.primary:disabled{opacity:.4;box-shadow:none}
.ghost{width:100%;background:#fff;color:var(--navy);font-weight:700;font-size:13px;padding:13px;border-radius:14px;border:1px solid var(--line);margin-top:10px}
.consensus{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:10px;padding:4px 9px;border-radius:8px;background:#f1f4f9;color:#5a6474}
.tag.warn{background:#fff4e4;color:#a9661f}
.tag.ok{background:#eaf5ef;color:#2f7d5d}
.days{display:flex;gap:8px;overflow:auto;padding:2px 0 10px}
.day{flex:none;padding:8px 14px;border-radius:12px;background:#fff;color:var(--muted);font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.day.on{background:var(--navy);color:#fff}
.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:2px;background:#e3e7ee}
.tl-item{position:relative;margin-bottom:12px}
.tl-item:before{content:"";position:absolute;left:-19px;top:18px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.tl-card{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.tl-card .t{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.tl-card h4{margin:4px 0 2px;font-size:13px;color:var(--navy)}
.tl-card .d{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.branch{font-size:9px;padding:2px 7px;border-radius:6px;background:#eef4ff;color:#3f639e;font-weight:700}
.branch.b{background:#fdf0e3;color:#a9661f}
.ledger-top{background:linear-gradient(150deg,#1b2a4a,#2c4370);border-radius:20px;padding:18px;color:#fff;box-shadow:0 14px 30px rgba(27,42,74,.2)}
.ledger-top .row{display:flex;justify-content:space-between;align-items:flex-end}
.ledger-top .big{font-size:30px;font-weight:800;letter-spacing:.5px}
.ledger-top small{color:#aeb9d0;font-size:10px}
.ledger-top .mini{display:flex;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);font-size:11px;color:#c9d3e6}
.ledger-top .mini b{display:block;color:#fff;font-size:14px;margin-top:1px}
.exp{display:flex;align-items:center;gap:12px;background:#fff;border-radius:15px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.exp .ei{width:36px;height:36px;border-radius:11px;background:#f1f4f9;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none}
.exp .et{flex:1;min-width:0}.exp .et b{display:block;font-size:12px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .et span{font-size:10px;color:var(--muted)}
.exp .amt{text-align:right;font-weight:800;color:var(--navy);font-size:13px}
.exp .amt span{display:block;font-weight:500;font-size:9px;color:var(--muted)}
.settle{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.settle .tr{display:flex;align-items:center;gap:8px;font-size:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.settle .tr:last-child{border:0}
.settle .who{font-weight:700;color:var(--navy)}
.settle .arrow{color:var(--accent);font-weight:800}
.settle .money{margin-left:auto;font-weight:800;color:var(--navy)}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:50}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:#9aa3b2;font-size:10px;font-weight:600;border-radius:12px}
.tab.on{color:var(--navy)}
.tab.on .ti{background:#f1f4f9}
.ti{width:34px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:.2s}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modal{position:fixed;inset:0;background:rgba(20,28,44,.45);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal.open{display:flex}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{margin:0 0 4px;font-size:18px;color:var(--navy)}
.sheet .hint{font-size:11px;color:var(--muted);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--navy);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;outline:none}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-size:11px;padding:7px 11px;border-radius:20px;background:#fff;border:1px solid var(--line);color:#5a6474}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:rgba(27,42,74,.94);color:#fff;font-size:12px;padding:10px 18px;border-radius:30px;opacity:0;pointer-events:none;transition:.25s;z-index:200;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.footnote{text-align:center;font-size:10px;color:#a3abba;margin:20px 0 6px}
.linkbtn{color:var(--accent);font-weight:700;font-size:11px}
.skeleton{color:var(--muted);font-size:12px;text-align:center;padding:20px}
@media (min-width:520px){body{padding:24px 0}.phone{border-radius:28px;overflow:hidden;min-height:calc(100vh - 48px)}}
</style>
</head>
<body>
<div class="phone">
  <header class="topbar">
    <div class="logo">毕</div>
    <div class="brand">毕旅<small>GRAD TRIP · 拼团规划</small></div>
    <div class="top-right"><span class="demo">DEMO</span><div class="me">林</div></div>
  </header>
  <main id="app"></main>
  <nav class="tabbar" id="tabs">
    <button class="tab on" data-act="tab" data-tab="home">
      <span class="ti"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></span>团</button>
    <button class="tab" data-act="tab" data-tab="decide">
      <span class="ti"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="m8 12 3 3 5-6"/></svg></span>定案</button>
    <button class="tab" data-act="tab" data-tab="trip">
      <span class="ti"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>行程</button>
    <button class="tab" data-act="tab" data-tab="ledger">
      <span class="ti"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3z"/><path d="M3 7V5h14v2"/><circle cx="16" cy="13" r="1.2"/></svg></span>账本</button>
  </nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const LS="bilv_demo_v1";
const COLORS=["#b97227","#3f639e","#2f7d5d","#8a5a9e","#c2543d","#4a7c8c","#a9661f","#5b6b8c","#7d6238","#456b4e","#8c4a5e","#4e5d7a"];
const NAMES=["林知夏","陈一鸣","王雨桐","赵一凡","孙可","李慕","周野","吴桐","郑好","何一","徐来","方晴"];
const seed=()=>({
  me:"m1",
  members:NAMES.map((n,i)=>({id:"m"+(i+1),name:n,role:i===0?"团长":i===1?"财务官":"成员",budget:[2500,1800,3200,2200,1500,2800,2400,3500,1200,2600,4200,3000][i],filled:i<9,tags:[]})),
  options:[
    {id:"qd",name:"青岛",days:"4 天 3 晚",price:2380,low:2100,high:2600,score:86,cover:11,total:12,tags:["海边","老城","高铁直达"],pros:"海边 + 啤酒 + 老城，预算可控",cons:"7 月旺季人多",transport:"高铁 4.5h"},
    {id:"cd",name:"成都",days:"5 天 4 晚",price:2650,low:2400,high:2900,score:81,cover:9,total:12,tags:["美食","熊猫","城市"],pros:"吃得好、玩得松，适合大团",cons:"人均偏高，3 人预算吃紧",transport:"飞机 3h"},
    {id:"dl",name:"大理",days:"5 天 4 晚",price:3100,low:2800,high:3400,score:74,cover:7,total:12,tags:["洱海","躺平","出片"],pros:"最适合躺平与拍照",cons:"交通耗时，预算超出 5 人上限",transport:"飞机 + 动车"}
  ],
  votes:[
    {m:"m2",r:["qd","cd","dl"]},{m:"m3",r:["qd","cd","dl"]},{m:"m4",r:["qd","cd","dl"]},
    {m:"m5",r:["cd","qd","dl"]},{m:"m6",r:["cd","qd","dl"]},
    {m:"m7",r:["dl","cd","qd"]},{m:"m8",r:["qd","dl","cd"]}
  ],
  veto:["m2","m5","m9"],
  expenses:[
    {id:"e1",title:"高铁往返",amount:7200,payer:"m1",rule:"全员均摊",parts:["m1","m2","m3","m4","m5","m6","m7","m8","m9","m10","m11","m12"]},
    {id:"e2",title:"民宿定金",amount:2400,payer:"m4",rule:"按参与人",parts:["m1","m2","m3","m4","m5","m6","m7","m8","m9","m10"]},
    {id:"e3",title:"包车定金",amount:1200,payer:"m3",rule:"按参与人",parts:["m1","m2","m3","m4","m5","m6","m7","m8"]},
    {id:"e4",title:"海鲜聚餐",amount:1800,payer:"m2",rule:"全员均摊",parts:["m1","m2","m3","m4","m5","m6","m7","m8","m9","m10","m11","m12"]}
  ],
  itinerary:{
    1:[{t:"08:30",title:"高铁 G106 · 北京南 → 青岛",d:"4h30 · 全员",cost:600,branch:""},{t:"14:00",title:"民宿入住 · 大学路",d:"10 人 · 3 晚",cost:480,branch:""},{t:"18:30",title:"台东夜市",d:"自由觅食 · 人均 60",cost:60,branch:""}],
    2:[{t:"09:00",title:"八大关漫步",d:"全程约 3h",cost:0,branch:""},{t:"14:00",title:"海水浴场躺平",d:"A 线 · 7 人",cost:0,branch:"A"},{t:"14:00",title:"崂山轻徒步",d:"B 线 · 4 人",cost:120,branch:"B"},{t:"19:00",title:"海鲜大餐",d:"12 人 · 已订位",cost:150,branch:""}],
    3:[{t:"10:00",title:"青岛啤酒博物馆",d:"门票 60 · 9 人",cost:60,branch:""},{t:"15:00",title:"小麦岛看日落",d:"拍照局",cost:0,branch:""},{t:"20:00",title:"民宿桌游夜",d:"自愿参加",cost:0,branch:""}],
    4:[{t:"09:00",title:"栈桥 + 老城区",d:"退房后集合",cost:0,branch:""},{t:"13:00",title:"返程 · 高铁 G115",d:"4h30",cost:600,branch:""}]
  }
});
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.members)return s}catch(e){}return seed()}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
const ui={tab:"home",day:1,rank:[],tmp:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>"¥"+Math.round(n).toLocaleString("zh-CN");
const byId=id=>state.members.find(m=>m.id===id)||{name:"?"};
const ini=n=>n.slice(-2);

function borda(){
  const map={};state.options.forEach(o=>map[o.id]=0);
  state.votes.forEach(v=>v.r.forEach((id,i)=>map[id]+=3-i));
  const arr=state.options.map(o=>({...o,pts:map[o.id]})).sort((a,b)=>b.pts-a.pts);
  const total=state.votes.length*6||1;
  return {arr,total,cons:Math.round((arr[0].pts-arr[1].pts)/total*100)};
}
function totals(){
  const paid={},owed={};state.members.forEach(m=>{paid[m.id]=0;owed[m.id]=0});
  state.expenses.forEach(e=>{paid[e.payer]+=e.amount;e.parts.forEach(id=>owed[id]+=e.amount/e.parts.length)});
  return {paid,owed,total:state.expenses.reduce((s,e)=>s+e.amount,0)};
}
function settle(){
  const {paid,owed}=totals();
  const cs=state.members.map(m=>({id:m.id,b:paid[m.id]-owed[m.id]})).filter(x=>x.b>0.5).sort((a,b)=>b.b-a.b);
  const ds=state.members.map(m=>({id:m.id,b:paid[m.id]-owed[m.id]})).filter(x=>x.b<-0.5).sort((a,b)=>a.b-b.b);
  const out=[];let i=0,j=0;
  while(i<ds.length&&j<cs.length){const a=Math.min(-ds[i].b,cs[j].b);out.push({from:ds[i].id,to:cs[j].id,amt:a});ds[i].b+=a;cs[j].b-=a;if(ds[i].b>-0.5)i++;if(cs[j].b<0.5)j++}
  return out;
}

/* ---------- modal ---------- */
function openModal(html){$("#sheet").innerHTML=html;$("#modal").classList.add("open")}
function closeModal(){$("#modal").classList.remove("open")}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove("show"),1800)}

function prefModal(){
  const m=state.members.find(x=>x.id===state.me);

  openModal(`<h3>我的意向卡</h3><div class="hint">3 分钟说清底线，预算默认只进聚合，别人看不到你的数字</div>

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const act=el.dataset.act;
  if(act==="tab"){ui.tab=el.dataset.tab;ui.rank=[];closeModal();render();window.scrollTo(0,0);return}
  if(act==="open:pref"){prefModal();return}
  if(act==="open:expense"){expenseModal();return}
  if(act==="open:activity"){activityModal();return}
  if(act==="close"){closeModal();return}
  if(act==="pref:tag"){
    const t=el.dataset.t;const i=ui.tmp.tags.indexOf(t);
    if(i>=0)ui.tmp.tags.splice(i,1);else ui.tmp.tags.push(t);
    el.classList.toggle("on");return;
  }
  if(act==="pref:save"){
    const m=state.members.find(x=>x.id===state.me);
    m.budget=+$("#budget").value;m.tags=ui.tmp.tags.slice();m.filled=true;
    save();closeModal();render();toast("意向卡已保存，聚合结果已更新");return;
  }
  if(act==="rank"){
    const id=el.dataset.id;const i=ui.rank.indexOf(id);
    if(i>=0)ui.rank.splice(i,1);else{if(ui.rank.length>=3)ui.rank.shift();ui.rank.push(id)}
    save();render();return;
  }
  if(act==="vote:submit"){
    if(ui.rank.length<3)return;
    state.votes=state.votes.filter(v=>v.m!==state.me);
    state.votes.push({m:state.me,r:ui.rank.slice()});
    save();render();toast("排序已提交，截止前可修改");return;
  }
  if(act==="exp:save"){
    const title=$("#etitle").value.trim()||"未命名支出";
    const amount=+$("#eamount").value;
    if(!(amount>0)){toast("请填写金额");return}
    const payer=$("#epayer").value;const rule=$("#erule").value;
    const parts=rule==="全员均摊"?state.members.map(m=>m.id):state.members.map(m=>m.id);
    state.expenses.push({id:"e"+Date.now(),title,amount,payer,rule,parts});
    save();closeModal();ui.tab="ledger";render();toast("已记账，人均已更新");return;
  }
  if(act==="act:save"){
    const time=$("#atime").value.trim()||"18:00";
    const title=$("#atitle").value.trim();
    if(!title){toast("请填写活动名称");return}
    state.itinerary[ui.day].push({t:time,title:title,d:$("#adesc").value.trim()||"待定",cost:+$("#acost").value||0,branch:""});
    save();closeModal();render();toast("已加入 D"+ui.day+" 行程");return;
  }
  if(act==="invite"){
    const url=location.href;
    navigator.clipboard&&navigator.clipboard.writeText(url).then(()=>toast("团链接已复制，发给同学吧"),()=>toast("复制失败，请手动复制地址栏"));
    if(!navigator.clipboard)toast("复制失败，请手动复制地址栏");
    return;
  }
  if(act==="reset"){
    if(confirm("重置后演示数据恢复初始状态，确定吗？")){state=seed();save();ui.tab="home";ui.rank=[];render();toast("演示数据已重置")}
    return;
  }
});
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
render();
</script>
